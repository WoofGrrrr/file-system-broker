<tr class="extension-list-item extension-installed extension-disabled extension-special extension-locked extension-dir-protect access-disallowed read-only"
    extensionId="example-extension@x.com"
    extensionName="Exmple Extension">

  <td class="extension-list-controls-left">
    <input type="checkbox"
           id="allowAccessCheck_example-extension@x.com"
           class="extension-check allow-access-check"
           extensionId="example-extension@x.com"
           title="???"/>
  </td>

  <td class="extension-list-data data-boolean extension-installed">
    <span class="data-boolean-dot dot-ext-installed" title="???"> <!-- dot-ext-installed -or- dot-ext-installed -->
      <!-- CSS will turn this into a colored dot depending on which class it has -->
    </span>
  </td>

  <td class="extension-list-data data-boolean extension-enabled">
    <span class="data-boolean-dot dot-ext-enabled" title="???"> <!-- dot-ext-enabled -or- dot-ext-disabled -->
      <!-- CSS will turn this into a colored dot depending on which class it has -->
    </span>
  </td>

  <td class="extension-list-data data-text extension-list-name" title="extension description">
    <span class="extension-list-name-text">
      Example Extension
    </span>
    <span class="extension-markers">
      <span class="extension-marker marker-special" title="???">
        <!-- CSS will turn this into a colored dot, depeding on a class "extension-special" on the <tr> -->
      </span>
      <span class="extension-marker marker-locked" title="???">
        <!-- CSS will turn this into a colored dot, depeding on a class "extension-locked" on the <tr> -->
      </span>
      <span class="extension-marker marker-dis-protected" title="???">
        <!-- CSS will turn this into a colored dot, depeding on a class "extension-dir-protect" on the <tr> -->
      </span>
      <span class="extension-marker marker-access-disallowed" title="???">
        <!-- CSS will turn this into a colored dot, depeding on a class "access-disallowed" on the <tr> -->
      </span>
    </span>
  </td>

  <td class="extension-list-data data-text extension-list-id" title="extension description">
    example-extension@x.com
  </td>

  <td class="extension-list-data data-boolean extension-list-stats-dir-exists">
    <span class="data-boolean-dot dot-stats-dir-exists" title="???"> <!-- dot-stats-dir-exists -or- dot-stats-not-dir-exists -->
      <!-- CSS will turn this into a colored dot depending on which class it has -->
    </span>
  </td>

  <td class="extension-list-data data-numeric extension-list-stats-item-count" title="???">
  </td>

  <td class="extension-list-data data-numeric extension-list-stats-total-size-fmt" title="???">
  </td>

  <td class="extension-list-data data-numeric extension-list-stats-total-size-bytes" title="???">
  </td>

  <td class="extension-list-data">
  </td>
</tr>
